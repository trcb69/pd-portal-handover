<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stock &amp; re-order</title>
<style>
/* Stock & re-order — a digital stock-take sheet.
   The quantity is the content, so numbers are set large and tabular, and the
   only colour in the interface carries stock status. Everything else is grey. */

:root{
  --paper:#EDF0F3;
  --sheet:#FFFFFF;
  --ink:#14232F;
  --ink-2:#5C6B78;
  --ink-3:#8A98A4;
  --rule:#DBE2E8;
  --navy:#1B3A5C;
  --navy-soft:#E6EDF4;

  --out:#B42318;
  --crit:#C2610A;
  --low:#8A7100;
  --ok:#067647;

  --pad:16px;
  --radius:6px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:var(--font);
  font-size:15px;
  line-height:1.45;
  color:var(--ink);
  background:var(--paper);
  -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font:inherit;color:inherit}
b{font-weight:650}

/* ── Top bar ─────────────────────────────────────────────────────────── */
.topbar{
  display:flex;align-items:center;gap:20px;
  padding:10px var(--pad);
  background:var(--navy);color:#fff;
  position:sticky;top:0;z-index:30;
}
.brand{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.brand b{display:block;font-size:15px;letter-spacing:.1px}
.brand small{display:block;font-size:11.5px;color:#A9C0D6}
.brand-mark{
  width:22px;height:22px;border-radius:3px;
  background:linear-gradient(180deg,#fff 0 8px,#7FA6C9 8px 14px,#fff 14px 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.5);
}
.search{flex:1 1 auto;max-width:380px}
.search input{
  width:100%;padding:8px 12px;border:0;border-radius:var(--radius);
  background:rgba(255,255,255,.14);color:#fff;
}
.search input::placeholder{color:#A9C0D6}
.search input:focus{outline:2px solid #7FA6C9;outline-offset:1px;background:rgba(255,255,255,.22)}

.tabs{display:flex;gap:2px;margin-left:auto}
.tab{
  background:none;border:0;color:#C7D8E7;padding:7px 12px;border-radius:var(--radius);
  cursor:pointer;white-space:nowrap;
}
.tab:hover{background:rgba(255,255,255,.1);color:#fff}
.tab.is-on{background:#fff;color:var(--navy);font-weight:600}
.badge{
  display:inline-block;min-width:19px;padding:0 5px;margin-left:5px;
  background:var(--out);color:#fff;border-radius:10px;
  font-size:11.5px;font-weight:650;text-align:center;font-variant-numeric:tabular-nums;
}
.tab.is-on .badge{background:var(--out)}
.who{display:flex;gap:6px;flex:0 0 auto}

.btn{
  border:1px solid var(--rule);background:var(--sheet);color:var(--ink);
  padding:8px 14px;border-radius:var(--radius);cursor:pointer;
}
.btn:hover{background:#F4F7F9}
.btn-quiet{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.28);color:#fff}
.btn-quiet:hover{background:rgba(255,255,255,.24)}
.btn-primary{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.btn-primary:hover{background:#24507E}
.btn:focus-visible,.tab:focus-visible,.signal:focus-visible,.row:focus-visible{outline:2px solid var(--navy);outline-offset:2px}

/* ── Signal strip ────────────────────────────────────────────────────── */
.signals{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:1px;
  background:var(--rule);border-bottom:1px solid var(--rule);
}
.signal{
  background:var(--sheet);border:0;padding:12px var(--pad);text-align:left;cursor:pointer;
  display:flex;flex-direction:column;gap:1px;border-top:3px solid transparent;
}
.signal:hover{background:#F5F8FA}
.signal em{font-style:normal;font-size:25px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.1}
.signal span{font-size:12.5px;color:var(--ink-2)}
.signal[data-filter="OUT"] em{color:var(--out)}
.signal[data-filter="CRITICAL"] em{color:var(--crit)}
.signal[data-filter="stale"] em,.signal[data-filter="LOW"] em{color:var(--low)}
.signal.is-on{border-top-color:var(--navy);background:var(--navy-soft)}

/* ── Layout ──────────────────────────────────────────────────────────── */
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);align-items:start}
.rail{
  position:sticky;top:118px;max-height:calc(100vh - 118px);overflow:auto;
  border-right:1px solid var(--rule);background:var(--sheet);padding:8px 0;
}
.rail button{
  display:flex;justify-content:space-between;gap:8px;width:100%;
  background:none;border:0;text-align:left;padding:7px 14px;cursor:pointer;
  color:var(--ink);border-left:3px solid transparent;
}
.rail button:hover{background:#F2F6F9}
.rail button.is-on{background:var(--navy-soft);border-left-color:var(--navy);font-weight:600}
.rail button i{font-style:normal;color:var(--ink-3);font-size:12.5px;font-variant-numeric:tabular-nums}
.rail-head{padding:10px 14px 4px;font-size:11.5px;color:var(--ink-3);letter-spacing:.3px}

.content{padding:var(--pad);min-height:60vh}

/* ── Item rows: a tally sheet, not a card deck ───────────────────────── */
.section-head{
  margin:22px 0 6px;padding-bottom:5px;border-bottom:2px solid var(--ink);
  font-size:13px;font-weight:650;
}
.section-head:first-child{margin-top:0}
.section-head span{float:right;font-weight:400;color:var(--ink-2)}

.rows{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden}
.row{
  display:grid;grid-template-columns:minmax(0,1fr) 132px 190px 96px;
  gap:14px;align-items:center;width:100%;
  padding:11px 14px;background:none;border:0;border-top:1px solid var(--rule);
  text-align:left;cursor:pointer;
}
.row:first-child{border-top:0}
.row:hover{background:#F5F8FA}

.row .name{min-width:0}
.row .name b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.row .meta .stale{color:var(--out);font-weight:600}

.qty{text-align:right;font-variant-numeric:tabular-nums}
.qty b{display:block;font-size:23px;font-weight:600;line-height:1.15}
.qty span{font-size:11.5px;color:var(--ink-3)}

/* The gauge is the one bold idea here: on-hand against the re-order mark. */
.gauge{position:relative}
.gauge .track{height:8px;background:#E9EEF2;border-radius:4px;overflow:hidden}
.gauge .fill{height:100%;border-radius:4px;background:var(--ok)}
.gauge .mark{position:absolute;top:-3px;width:2px;height:14px;background:var(--ink);opacity:.55}
.gauge .cap{margin-top:4px;font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.lv-OUT      .fill{background:var(--out)}
.lv-CRITICAL .fill{background:var(--crit)}
.lv-LOW      .fill{background:var(--low)}
.lv-OUT .status{color:var(--out)}
.lv-CRITICAL .status{color:var(--crit)}
.lv-LOW .status{color:var(--low)}
.lv-OK .status{color:var(--ink-3)}
.status{font-size:12.5px;font-weight:600;text-align:right}

.empty{padding:56px 20px;text-align:center;color:var(--ink-2)}
.empty b{display:block;font-size:17px;color:var(--ink);margin-bottom:6px}

/* ── Tables (order list, requisitions, activity) ─────────────────────── */
table{width:100%;border-collapse:collapse;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--radius)}
th,td{padding:9px 12px;text-align:left;border-top:1px solid var(--rule);vertical-align:top}
th{background:#F4F7F9;font-size:12.5px;color:var(--ink-2);font-weight:600;border-top:0;position:sticky;top:118px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:#F8FAFB}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11.5px;font-weight:600;background:#EEF1F4;color:var(--ink-2)}
.pill.OPEN{background:#FDF1E3;color:var(--crit)}
.pill.PARTIAL{background:#FCF9E4;color:var(--low)}
.pill.CLOSED{background:#E6F4EC;color:var(--ok)}
.pill.CANCELLED{background:#EEF1F4;color:var(--ink-3)}

/* ── Slide-in panel ──────────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(20,35,47,.4);z-index:40}
.panel{
  position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);z-index:50;
  background:var(--sheet);border-left:1px solid var(--rule);
  box-shadow:-14px 0 40px rgba(20,35,47,.16);
  display:flex;flex-direction:column;overflow:auto;
  animation:slide .18s ease-out;
}
@keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}

.panel-head{padding:16px var(--pad);border-bottom:1px solid var(--rule)}
.panel-head .close{float:right;background:none;border:0;font-size:22px;cursor:pointer;color:var(--ink-2);line-height:1}
.panel-head h2{margin:0 30px 2px 0;font-size:17px;font-weight:600}
.panel-head p{margin:0;font-size:12.5px;color:var(--ink-3)}
.panel-body{padding:var(--pad);display:flex;flex-direction:column;gap:16px}

.onhand{display:flex;align-items:baseline;gap:10px}
.onhand b{font-size:40px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.onhand span{color:var(--ink-2);font-size:13px}

.kinds{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kinds button{
  padding:11px 6px;border:1px solid var(--rule);background:var(--sheet);
  border-radius:var(--radius);cursor:pointer;font-size:13.5px;
}
.kinds button.is-on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.hint{font-size:12.5px;color:var(--ink-2);margin:-8px 0 0}

label{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:4px}
.field input,.field select,.field textarea{
  width:100%;padding:10px 12px;border:1px solid var(--rule);border-radius:var(--radius);background:var(--sheet);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--navy);outline-offset:-1px;border-color:var(--navy)}
#qtyInput{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.result{font-size:13px;color:var(--ink-2);text-align:right}
.err{color:var(--out);font-size:13px}

.history{border-top:1px solid var(--rule);padding-top:12px}
.history h3{font-size:12.5px;color:var(--ink-2);margin:0 0 8px;font-weight:600}
.history li{list-style:none;display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--rule);font-size:13px}
.history ul{margin:0;padding:0}
.history .d{color:var(--ink-3);font-size:11.5px}
.history .v{font-variant-numeric:tabular-nums;white-space:nowrap}

.toast{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,80px);
  background:var(--ink);color:#fff;padding:11px 18px;border-radius:var(--radius);
  z-index:60;opacity:0;transition:transform .2s,opacity .2s;pointer-events:none;
}
.toast.is-on{transform:translate(-50%,0);opacity:1}

/* ── Narrow screens: the warehouse case ──────────────────────────────── */
@media (max-width:900px){
  .topbar{flex-wrap:wrap;gap:10px}
  .search{order:3;max-width:none;flex-basis:100%}
  .tabs{margin-left:0;order:4;flex-basis:100%;overflow-x:auto}
  .signal em{font-size:21px}
  .layout{grid-template-columns:1fr}
  /* On a phone the group list becomes a swipeable row of chips so it does
     not eat half the screen before the stock even appears. */
  .rail{position:static;display:flex;gap:6px;overflow-x:auto;padding:8px var(--pad);
        border-right:0;border-bottom:1px solid var(--rule);-webkit-overflow-scrolling:touch}
  .rail .rail-head{display:none}
  .rail button{width:auto;flex:0 0 auto;white-space:nowrap;border:1px solid var(--rule);
               border-left-width:1px;border-radius:16px;padding:5px 12px}
  .rail button.is-on{border-color:var(--navy)}
  .rail button i{display:none}
  th{position:static}
  .row{grid-template-columns:minmax(0,1fr) auto;gap:8px 12px}
  .row .gauge{grid-column:1/-1}
  .row .status{grid-column:1/-1;text-align:left}
  .panel{width:100%;top:auto;height:92vh;border-left:0;border-radius:12px 12px 0 0}
}

/* Keep [hidden] authoritative: .panel sets display:flex, which would
   otherwise beat the browser's own hidden rule and leave an invisible
   panel swallowing clicks. */
[hidden]{display:none !important}


.preview-note{background:#FCF9E4;border-bottom:1px solid #E6DFB8;color:#5C5322;
  padding:9px 16px;font-size:12.5px;line-height:1.4}
</style>
</head>

<div class="preview-note">
  Preview of the real interface, running on a slice of your workbook —
  7 customers, 150 items. Counting, raising and receiving all work; the changes
  live in this page instead of the database.
</div>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <span>
      <b>Stock &amp; re-order</b>
      <small id="company">Standard Holdings</small>
    </span>
  </div>

  <div class="search">
    <input id="search" type="search" placeholder="Search item or SKU" autocomplete="off" aria-label="Search item or SKU">
  </div>

  <nav class="tabs" role="tablist">
    <button class="tab is-on" data-view="stock" role="tab">Stock</button>
    <button class="tab" data-view="order" role="tab">Order list <span class="badge" id="badge-order">0</span></button>
    <button class="tab" data-view="reqs" role="tab">Requisitions</button>
    <button class="tab" data-view="activity" role="tab">Activity</button>
  </nav>

  <div class="who">
    <button id="export" class="btn btn-quiet" title="Download the Excel report">Excel</button>
    <button id="whoami" class="btn btn-quiet" aria-label="Change who is signed in">—</button>
  </div>
</header>

<!-- The four counts double as filters: tap one to see only those items. -->
<section class="signals" id="signals" aria-label="Stock position">
  <button class="signal" data-filter="OUT"><em id="c-out">0</em><span>Out of stock</span></button>
  <button class="signal" data-filter="CRITICAL"><em id="c-crit">0</em><span>Below re-order level</span></button>
  <button class="signal" data-filter="LOW"><em id="c-low">0</em><span>Into buffer stock</span></button>
  <button class="signal" data-filter="stale"><em id="c-stale">0</em><span>Count out of date</span></button>
  <button class="signal signal-ok" data-filter=""><em id="c-total">0</em><span>All items</span></button>
</section>

<main class="layout">
  <aside class="rail" id="rail" aria-label="Customers and groups"></aside>
  <div class="content" id="content"></div>
</main>

<!-- Slide-in editor -->
<div class="scrim" id="scrim" hidden></div>
<aside class="panel" id="panel" hidden aria-label="Update stock"></aside>

/* ── Preview stand-in ──────────────────────────────────────────────────────
   Holds the same data the server would return and applies the same rules, so
   counting stock, raising a requisition and receiving goods all really work
   here — the changes just live in the page instead of in SQLite.            */
const DEMO = (() => {
  const D = SEED;
  let nextTxn = Math.max(0, ...D.txns.map(t => t.id)) + 1;
  let nextOrder = Math.max(0, ...D.orders.map(o => o.id)) + 1;
  const audit = [];
  const STALE = 30;
  const now = () => new Date().toISOString().slice(0, 19).replace('T', ' ');

  function statusOf(it) {
    const q = it.qty ?? 0, reorder = it.reorder_level ?? 0, buffer = it.buffer ?? 0;
    let level = 'OK';
    if (q <= 0) level = 'OUT';
    else if (reorder > 0 && q <= reorder) level = 'CRITICAL';
    else if (buffer > 0 && q <= buffer) level = 'LOW';
    const days = it.counted_at ? Math.floor((Date.now() - Date.parse(it.counted_at.replace(' ', 'T') + 'Z')) / 86400000) : null;
    const target = it.max_stock || buffer || reorder * 2;
    return { level, days_since_count: days, stale: days === null || days > STALE,
             suggested_order: level === 'OK' ? 0 : Math.max(0, target - q) };
  }

  const onOrder = (id) => D.orders.filter(o => o.item_id === id && (o.status === 'OPEN' || o.status === 'PARTIAL'))
    .reduce((a, o) => a + (o.qty_ordered - o.qty_received), 0);
  const decorate = (it) => ({ ...it, on_order: onOrder(it.id), ...statusOf(it) });

  function ask(msg, def) {
    try { const v = window.prompt(msg, def); return v === null ? null : v; }
    catch (e) { return def; }
  }

  function log(actor, action, entity, entity_id, before, after) {
    audit.unshift({ id: audit.length + 1, ts: now(), actor, action, entity, entity_id,
      before_json: before ? JSON.stringify(before) : null,
      after_json: after ? JSON.stringify(after) : null, ip: '10.0.0.14' });
  }

  async function api(path, opts = {}, actor) {
    const [route, query] = path.split('?');
    const p = new URLSearchParams(query || '');
    const body = opts.body ? JSON.parse(opts.body) : {};
    const method = opts.method || 'GET';
    await new Promise(r => setTimeout(r, 60)); // feels like the real thing

    if (route === '/bootstrap') {
      const s = { total: D.items.length, OUT: 0, CRITICAL: 0, LOW: 0, OK: 0, stale: 0 };
      for (const it of D.items) { const st = statusOf(it); s[st.level]++; if (st.stale) s.stale++; }
      s.open_orders = D.orders.filter(o => o.status === 'OPEN' || o.status === 'PARTIAL').length;
      return {
        groups: D.groups.map(g => ({ ...g, item_count: D.items.filter(i => i.group_id === g.id).length })),
        company: 'Standard Holdings (Pvt) Ltd', stale_days: STALE, digest_hour: 8,
        webhook_set: false, summary: s,
      };
    }

    if (route === '/items' && method === 'GET') {
      let out = D.items.map(decorate);
      if (p.get('group')) out = out.filter(i => i.group_id === Number(p.get('group')));
      if (p.get('q')) {
        const q = p.get('q').toLowerCase();
        out = out.filter(i => i.name.toLowerCase().includes(q) || (i.sku || '').toLowerCase().includes(q));
      }
      const st = p.get('status');
      if (st === 'attention') out = out.filter(i => i.level !== 'OK');
      else if (st === 'stale') out = out.filter(i => i.stale);
      else if (st) out = out.filter(i => i.level === st);
      return out;
    }

    let m;
    if ((m = route.match(/^\/items\/(\d+)$/)) && method === 'GET') {
      const it = D.items.find(i => i.id === Number(m[1]));
      return { ...decorate(it),
        history: D.txns.filter(t => t.item_id === it.id).sort((a, b) => b.id - a.id).slice(0, 100),
        orders: D.orders.filter(o => o.item_id === it.id) };
    }

    if ((m = route.match(/^\/items\/(\d+)$/)) && method === 'PATCH') {
      const it = D.items.find(i => i.id === Number(m[1]));
      const before = { ...it };
      Object.assign(it, body);
      log(actor, 'item.update', 'item', it.id, before, { ...it });
      return decorate(it);
    }

    if ((m = route.match(/^\/items\/(\d+)\/stock$/))) {
      const it = D.items.find(i => i.id === Number(m[1]));
      const { kind, note } = body;
      const n = Math.round(Number(body.value));
      if (!Number.isFinite(n)) throw new Error('Enter a number');
      if (kind !== 'COUNT' && n <= 0) throw new Error('Enter a quantity above zero');
      const before = it.qty;
      const after = kind === 'COUNT' ? n : kind === 'IN' ? before + n : before - n;
      if (after < 0) throw new Error(`Only ${before.toLocaleString()} on hand — cannot issue ${n.toLocaleString()}`);
      D.txns.push({ id: nextTxn++, item_id: it.id, kind, qty_before: before, qty_delta: after - before,
        qty_after: after, note: note || null, actor, created_at: now() });
      it.qty = after;
      if (kind === 'COUNT') { it.counted_at = now(); it.counted_by = actor; }
      log(actor, 'stock.' + kind.toLowerCase(), 'item', it.id, { qty: before }, { qty: after, note: note || null });
      return decorate(it);
    }

    if (route === '/orders' && method === 'GET') {
      let out = D.orders.slice();
      if (p.get('status') === 'open') out = out.filter(o => o.status === 'OPEN' || o.status === 'PARTIAL');
      return out.sort((a, b) => String(b.ordered_at).localeCompare(String(a.ordered_at)));
    }

    if (route === '/orders' && method === 'POST') {
      const it = D.items.find(i => i.id === Number(body.item_id));
      const o = { id: nextOrder++, item_id: it.id, supplier: body.supplier || 'Manufactured',
        qty_ordered: Math.round(body.qty_ordered), qty_received: 0, status: 'OPEN',
        ordered_at: now().slice(0, 10), note: null, created_by: actor,
        item_name: it.name, sku: it.sku, group_name: it.group_name };
      D.orders.push(o);
      log(actor, 'order.create', 'order', o.id, null, { item: it.name, qty: o.qty_ordered });
      return { id: o.id };
    }

    if ((m = route.match(/^\/orders\/(\d+)\/receive$/))) {
      const o = D.orders.find(x => x.id === Number(m[1]));
      const it = D.items.find(i => i.id === o.item_id);
      const qty = Math.round(Number(body.qty));
      if (!(qty > 0)) throw new Error('Enter the quantity received');
      D.txns.push({ id: nextTxn++, item_id: it.id, kind: 'IN', qty_before: it.qty, qty_delta: qty,
        qty_after: it.qty + qty, note: 'Received against requisition #' + o.id, actor, created_at: now() });
      it.qty += qty;
      const wasStatus = o.status;
      o.qty_received += qty;
      o.status = o.qty_received >= o.qty_ordered ? 'CLOSED' : 'PARTIAL';
      log(actor, 'order.receive', 'order', o.id, { qty_received: o.qty_received - qty, status: wasStatus },
        { qty_received: o.qty_received, status: o.status });
      return { order_id: o.id, received: o.qty_received, status: o.status, item_qty: it.qty };
    }

    if (route === '/audit') return audit.slice(0, Number(p.get('limit')) || 200);
    if (route === '/alerts') return D.items.map(decorate).filter(i => i.level !== 'OK');
    throw new Error('Not available in the preview');
  }

  return { api, ask };
})();
</script>
<script>
'use strict';
/* Stock & re-order — front end. No build step: served straight off Express. */

const $ = (s) => document.querySelector(s);
const fmt = (n) => (n === null || n === undefined ? '—' : Number(n).toLocaleString('en-US'));
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const state = { view: 'stock', group: null, filter: '', q: '', items: [], groups: [], actor: 'Hadhee' };

async function api(path, opts = {}) {
  return DEMO.api(path, opts, state.actor);
}

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('is-on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('is-on'), 2600);
}

/* ── Who is entering this? Every movement is stored against a name. ───── */
function askWho(force) {
  if (state.actor && !force) return;
  const name = DEMO.ask('Your name (stored against everything you enter):', state.actor || '');
  if (name && name.trim()) {
    state.actor = name.trim();
    $('#whoami').textContent = state.actor;
  } else if (!state.actor) {
    setTimeout(() => askWho(), 400);
  }
}

/* ── Boot ─────────────────────────────────────────────────────────────── */
async function boot() {
  const b = await api('/bootstrap');
  state.groups = b.groups;
  state.staleDays = b.stale_days;
  $('#company').textContent = b.company;
  $('#whoami').textContent = state.actor || 'Sign in';
  drawRail();
  applySummary(b.summary);
  await load();
}

function applySummary(s) {
  $('#c-out').textContent = fmt(s.OUT);
  $('#c-crit').textContent = fmt(s.CRITICAL);
  $('#c-low').textContent = fmt(s.LOW);
  $('#c-stale').textContent = fmt(s.stale);
  $('#c-total').textContent = fmt(s.total);
  const needs = s.OUT + s.CRITICAL + s.LOW;
  const badge = $('#badge-order');
  badge.textContent = fmt(needs);
  badge.hidden = needs === 0;
}

function drawRail() {
  const total = state.groups.reduce((a, g) => a + g.item_count, 0);
  $('#rail').innerHTML =
    `<div class="rail-head">Customers and groups</div>` +
    `<button data-group="" class="${state.group ? '' : 'is-on'}">All items <i>${fmt(total)}</i></button>` +
    state.groups.map((g) =>
      `<button data-group="${g.id}" class="${state.group == g.id ? 'is-on' : ''}">${esc(g.name)} <i>${fmt(g.item_count)}</i></button>`).join('');
}

/* ── Views ────────────────────────────────────────────────────────────── */
async function load() {
  const c = $('#content');
  c.setAttribute('aria-busy', 'true');
  try {
    if (state.view === 'stock') await viewStock();
    else if (state.view === 'order') await viewOrderList();
    else if (state.view === 'reqs') await viewReqs();
    else await viewActivity();
  } catch (e) {
    c.innerHTML = `<div class="empty"><b>Could not load</b>${esc(e.message)}</div>`;
  }
  c.removeAttribute('aria-busy');
}

function gauge(it) {
  const target = it.max_stock || it.buffer || it.reorder_level * 2 || Math.max(it.qty, 1);
  const pct = Math.max(2, Math.min(100, (it.qty / target) * 100));
  const markPct = target ? Math.min(100, (it.reorder_level / target) * 100) : 0;
  return `<div class="gauge">
    <div class="track"><div class="fill" style="width:${pct.toFixed(1)}%"></div></div>
    ${it.reorder_level ? `<div class="mark" style="left:${markPct.toFixed(1)}%" title="Re-order level"></div>` : ''}
    <div class="cap">order at ${fmt(it.reorder_level)} · target ${fmt(target)}${it.on_order ? ` · ${fmt(it.on_order)} on order` : ''}</div>
  </div>`;
}

const WORD = { OUT: 'Out of stock', CRITICAL: 'Order now', LOW: 'Getting low', OK: 'OK' };

async function viewStock() {
  const qs = new URLSearchParams();
  if (state.group) qs.set('group', state.group);
  if (state.filter) qs.set('status', state.filter);
  if (state.q) qs.set('q', state.q);
  const items = (state.items = await api('/items?' + qs));

  if (!items.length) {
    $('#content').innerHTML = `<div class="empty"><b>Nothing here</b>${
      state.q ? 'No item matches that search.' : state.filter ? 'No items in this state — good.' : 'Add an item to get started.'}</div>`;
    return;
  }

  // Group by customer, then by the sub-tables some sheets used.
  const buckets = new Map();
  for (const it of items) {
    const k = it.group_name + (it.section ? ' — ' + it.section : '');
    (buckets.get(k) || buckets.set(k, []).get(k)).push(it);
  }

  $('#content').innerHTML = [...buckets].map(([head, list]) => {
    const need = list.filter((i) => i.level !== 'OK').length;
    return `<div class="section-head">${esc(head)}<span>${fmt(list.length)} items${need ? ` · ${need} need ordering` : ''}</span></div>
    <div class="rows">${list.map((it) => `
      <button class="row lv-${it.level}" data-item="${it.id}">
        <span class="name">
          <b>${esc(it.name)}</b>
          <span class="meta">${it.sku ? esc(it.sku) + ' · ' : ''}${
            it.days_since_count === null ? '<span class="stale">never counted</span>'
            : it.stale ? `<span class="stale">counted ${it.days_since_count} days ago</span>`
            : `counted ${it.days_since_count === 0 ? 'today' : it.days_since_count + ' days ago'}`}</span>
        </span>
        <span class="qty"><b>${fmt(it.qty)}</b><span>${esc(it.uom)} on hand</span></span>
        ${gauge(it)}
        <span class="status">${WORD[it.level]}${it.suggested_order ? `<br><span class="meta">order ${fmt(it.suggested_order)}</span>` : ''}</span>
      </button>`).join('')}</div>`;
  }).join('');
}

async function viewOrderList() {
  const items = (await api('/items?status=attention' + (state.group ? '&group=' + state.group : '')))
    .filter((i) => i.suggested_order > 0)
    .sort((a, b) => ['OUT', 'CRITICAL', 'LOW'].indexOf(a.level) - ['OUT', 'CRITICAL', 'LOW'].indexOf(b.level));

  if (!items.length) { $('#content').innerHTML = `<div class="empty"><b>Nothing to order</b>Every item is above its re-order level.</div>`; return; }

  $('#content').innerHTML = `
    <div class="section-head">What to order now<span>${fmt(items.length)} items</span></div>
    <table><thead><tr>
      <th>Item</th><th>Customer</th><th class="n">On hand</th><th class="n">Order at</th>
      <th class="n">On order</th><th class="n">Order this</th><th>Why</th><th></th>
    </tr></thead><tbody>
    ${items.map((i) => `<tr>
      <td><b>${esc(i.name)}</b>${i.sku ? `<div class="meta">${esc(i.sku)}</div>` : ''}</td>
      <td>${esc(i.group_name)}</td>
      <td class="n">${fmt(i.qty)}</td><td class="n">${fmt(i.reorder_level)}</td>
      <td class="n">${i.on_order ? fmt(i.on_order) : '—'}</td>
      <td class="n"><b>${fmt(i.suggested_order)}</b></td>
      <td><span class="pill">${WORD[i.level]}</span></td>
      <td><button class="btn" data-raise="${i.id}" data-qty="${i.suggested_order}">Raise</button></td>
    </tr>`).join('')}</tbody></table>`;
}

async function viewReqs() {
  const rows = await api('/orders?status=open');
  if (!rows.length) { $('#content').innerHTML = `<div class="empty"><b>No open requisitions</b>Raise one from the order list.</div>`; return; }
  $('#content').innerHTML = `
    <div class="section-head">Open requisitions<span>${fmt(rows.length)}</span></div>
    <table><thead><tr>
      <th>Ref</th><th>Raised</th><th>Item</th><th>Supplier</th>
      <th class="n">Ordered</th><th class="n">Received</th><th class="n">Outstanding</th><th>Status</th><th></th>
    </tr></thead><tbody>
    ${rows.map((o) => `<tr>
      <td>#${o.id}</td><td>${String(o.ordered_at).slice(0, 10)}</td>
      <td><b>${esc(o.item_name)}</b><div class="meta">${esc(o.group_name)}</div></td>
      <td>${esc(o.supplier)}</td>
      <td class="n">${fmt(o.qty_ordered)}</td><td class="n">${fmt(o.qty_received)}</td>
      <td class="n"><b>${fmt(o.qty_ordered - o.qty_received)}</b></td>
      <td><span class="pill ${o.status}">${o.status === 'PARTIAL' ? 'Part received' : 'Waiting'}</span></td>
      <td><button class="btn" data-receive="${o.id}" data-out="${o.qty_ordered - o.qty_received}">Receive</button></td>
    </tr>`).join('')}</tbody></table>`;
}

async function viewActivity() {
  const rows = await api('/audit?limit=300');
  $('#content').innerHTML = `
    <div class="section-head">Everything that has been changed<span>latest ${fmt(rows.length)}</span></div>
    <table><thead><tr><th>When</th><th>Who</th><th>What</th><th>Before</th><th>After</th></tr></thead><tbody>
    ${rows.map((a) => `<tr>
      <td>${esc(a.ts)}</td><td>${esc(a.actor)}</td><td>${esc(a.action)}</td>
      <td class="meta">${esc(a.before_json || '—')}</td><td class="meta">${esc(a.after_json || '—')}</td>
    </tr>`).join('')}</tbody></table>`;
}

/* ── Update panel ─────────────────────────────────────────────────────── */
let panelItem = null, panelKind = 'COUNT';

async function openItem(id) {
  askWho();
  const it = (panelItem = await api('/items/' + id));
  panelKind = 'COUNT';
  $('#scrim').hidden = false;
  const p = $('#panel');
  p.hidden = false;
  p.className = 'panel lv-' + it.level;
  p.innerHTML = `
    <div class="panel-head">
      <button class="close" aria-label="Close">&times;</button>
      <h2>${esc(it.name)}</h2>
      <p>${it.sku ? esc(it.sku) + ' · ' : ''}${esc(it.group_name)}</p>
    </div>
    <div class="panel-body">
      <div class="onhand"><b>${fmt(it.qty)}</b><span>${esc(it.uom)} on hand · ${
        it.days_since_count === null ? 'never counted' : `counted ${it.days_since_count} days ago${it.counted_by ? ' by ' + esc(it.counted_by) : ''}`}</span></div>
      ${gauge(it)}

      <div class="kinds" role="group" aria-label="What are you recording?">
        <button data-kind="COUNT" class="is-on">Counted</button>
        <button data-kind="IN">Received</button>
        <button data-kind="OUT">Issued</button>
      </div>
      <p class="hint" id="kindHint">Enter the quantity you counted on the shelf. This replaces the figure above.</p>

      <div class="field">
        <label for="qtyInput" id="qtyLabel">Quantity counted</label>
        <input id="qtyInput" type="number" inputmode="numeric" min="0" step="1" value="${it.qty}">
        <div class="result" id="result"></div>
      </div>

      <div class="field">
        <label for="noteInput">Note (optional)</label>
        <input id="noteInput" type="text" placeholder="e.g. counted with Lukshitha, rack B">
      </div>

      <button class="btn btn-primary" id="saveStock">Save movement</button>
      <div class="err" id="panelErr"></div>

      <details class="field">
        <summary style="cursor:pointer;font-size:13px;color:var(--ink-2)">Change re-order levels</summary>
        <div class="grid2" style="margin-top:10px">
          <div><label for="lvReorder">Order at</label><input id="lvReorder" type="number" min="0" value="${it.reorder_level}"></div>
          <div><label for="lvBuffer">Buffer</label><input id="lvBuffer" type="number" min="0" value="${it.buffer}"></div>
          <div><label for="lvMax">Target level</label><input id="lvMax" type="number" min="0" value="${it.max_stock ?? ''}"></div>
          <div><label for="lvSku">SKU</label><input id="lvSku" type="text" value="${esc(it.sku || '')}"></div>
        </div>
        <button class="btn" id="saveLevels" style="margin-top:10px">Save levels</button>
      </details>

      <div class="history">
        <h3>Recent movements</h3>
        <ul>${it.history.slice(0, 12).map((h) => `<li>
          <span><b>${({ COUNT: 'Counted', IN: 'Received', OUT: 'Issued', ADJUST: 'Adjusted', OPENING: 'Opening balance' })[h.kind]}</b>
            <span class="d">${esc(h.created_at)} · ${esc(h.actor)}${h.note ? ' · ' + esc(h.note) : ''}</span></span>
          <span class="v">${h.qty_delta >= 0 ? '+' : ''}${fmt(h.qty_delta)} → ${fmt(h.qty_after)}</span>
        </li>`).join('') || '<li>Nothing recorded yet</li>'}</ul>
      </div>
    </div>`;

  p.querySelector('.close').onclick = closePanel;
  p.querySelectorAll('.kinds button').forEach((b) => (b.onclick = () => setKind(b.dataset.kind)));
  $('#qtyInput').oninput = preview;
  $('#saveStock').onclick = saveStock;
  $('#saveLevels').onclick = saveLevels;
  $('#qtyInput').focus();
  $('#qtyInput').select();
  preview();
}

function setKind(kind) {
  panelKind = kind;
  document.querySelectorAll('.kinds button').forEach((b) => b.classList.toggle('is-on', b.dataset.kind === kind));
  const copy = {
    COUNT: ['Quantity counted', 'Enter the quantity you counted on the shelf. This replaces the figure above.', panelItem.qty],
    IN: ['Quantity received', 'Goods coming in. This is added to what is already on hand.', ''],
    OUT: ['Quantity issued', 'Goods going out to production or dispatch. This is taken off what is on hand.', ''],
  }[kind];
  $('#qtyLabel').textContent = copy[0];
  $('#kindHint').textContent = copy[1];
  const input = $('#qtyInput');
  input.value = copy[2];
  input.focus();
  input.select();
  preview();
}

function preview() {
  const n = Number($('#qtyInput').value);
  const before = panelItem.qty;
  const after = !Number.isFinite(n) ? before : panelKind === 'COUNT' ? n : panelKind === 'IN' ? before + n : before - n;
  $('#result').textContent = panelKind === 'COUNT' ? '' : `${fmt(before)} → ${fmt(after)}`;
  $('#result').style.color = after < 0 ? 'var(--out)' : '';
}

async function saveStock() {
  const btn = $('#saveStock');
  btn.disabled = true;
  $('#panelErr').textContent = '';
  try {
    await api(`/items/${panelItem.id}/stock`, {
      method: 'POST',
      body: JSON.stringify({ kind: panelKind, value: Number($('#qtyInput').value), note: $('#noteInput').value }),
    });
    toast('Saved');
    closePanel();
    await refresh();
  } catch (e) {
    $('#panelErr').textContent = e.message;
  }
  btn.disabled = false;
}

async function saveLevels() {
  try {
    await api('/items/' + panelItem.id, {
      method: 'PATCH',
      body: JSON.stringify({
        reorder_level: Number($('#lvReorder').value) || 0,
        buffer: Number($('#lvBuffer').value) || 0,
        max_stock: $('#lvMax').value === '' ? null : Number($('#lvMax').value),
        sku: $('#lvSku').value.trim() || null,
      }),
    });
    toast('Levels updated');
    closePanel();
    await refresh();
  } catch (e) { $('#panelErr').textContent = e.message; }
}

function closePanel() {
  $('#panel').hidden = true;
  $('#scrim').hidden = true;
  panelItem = null;
}

async function refresh() {
  const b = await api('/bootstrap');
  state.groups = b.groups;
  applySummary(b.summary);
  drawRail();
  await load();
}

/* ── Wiring ───────────────────────────────────────────────────────────── */
document.addEventListener('click', async (e) => {
  const tab = e.target.closest('.tab');
  if (tab) {
    document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('is-on', t === tab));
    state.view = tab.dataset.view;
    return load();
  }

  const sig = e.target.closest('.signal');
  if (sig) {
    state.filter = state.filter === sig.dataset.filter ? '' : sig.dataset.filter;
    document.querySelectorAll('.signal').forEach((s) => s.classList.toggle('is-on', s.dataset.filter === state.filter && state.filter));
    state.view = 'stock';
    document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('is-on', t.dataset.view === 'stock'));
    return load();
  }

  const g = e.target.closest('[data-group]');
  if (g) { state.group = g.dataset.group || null; drawRail(); return load(); }

  const row = e.target.closest('[data-item]');
  if (row) return openItem(row.dataset.item);

  if (e.target.id === 'scrim') return closePanel();
  if (e.target.id === 'whoami') return askWho(true);
  if (e.target.id === 'export') {
    return toast('The real app downloads the Excel report here');
  }

  const raise = e.target.closest('[data-raise]');
  if (raise) {
    askWho();
    const qty = DEMO.ask('Quantity to order:', raise.dataset.qty);
    if (!qty) return;
    try {
      await api('/orders', { method: 'POST', body: JSON.stringify({ item_id: Number(raise.dataset.raise), qty_ordered: Number(qty) }) });
      toast('Requisition raised');
      await refresh();
    } catch (err) { toast(err.message); }
  }

  const rec = e.target.closest('[data-receive]');
  if (rec) {
    askWho();
    const qty = DEMO.ask('Quantity received:', rec.dataset.out);
    if (!qty) return;
    try {
      await api(`/orders/${rec.dataset.receive}/receive`, { method: 'POST', body: JSON.stringify({ qty: Number(qty) }) });
      toast('Received and added to stock');
      await refresh();
    } catch (err) { toast(err.message); }
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !$('#panel').hidden) closePanel();
  if (e.key === 'Enter' && !$('#panel').hidden && e.target.id === 'qtyInput') saveStock();
});

let searchTimer;
$('#search').addEventListener('input', (e) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { state.q = e.target.value.trim(); state.view = 'stock'; load(); }, 220);
});

askWho();
boot().catch((e) => ($('#content').innerHTML = `<div class="empty"><b>Could not start</b>${esc(e.message)}</div>`));

</script>
</body>
</html>
